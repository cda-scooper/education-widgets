<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Schedule Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
    <button id="toggle-visibility" class="icon-btn" title="Show/Hide Controls" style="font-size: 1.3em;">👁️</button>
    <button id="help-btn" class="icon-btn" title="Help" style="font-size: 1.3em;">❓</button>
  </div>
  <div id="schedule-container">
    <div id="schedule-list"></div>
  </div>
  <div style="margin: 10px 0; display: flex; align-items: center; gap: 10px;">
    <button id="add-schedule-btn" class="calendar-btn">➕ Add Task</button>
    <select id="theme-select" class="calendar-btn hideable-control" style="width: auto;">
      <option value="default">Default</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="purple">Purple</option>
      <option value="orange">Orange</option>
    </select>
  </div>
  <div id="schedule-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Add Schedule Item</h2>
      <input type="time" id="schedule-time" placeholder="Time">
      <input type="text" id="schedule-task" placeholder="Task">
      <input type="text" id="schedule-emoji" placeholder="Emoji" maxlength="2" style="width: 60px; display: inline-block;">
      <emoji-picker id="emoji-picker" style="width: 100%;"></emoji-picker>
      <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
      <button id="save-schedule-btn">Save</button>
    </div>
  </div>
  <div id="help-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-help-btn">&times;</span>
      <h2>How to Use the Classroom Schedule Widget</h2>
      <ul>
        <li>Click <b>➕ Add Task</b> to add a new schedule item.</li>
        <li>Each item can have a time, a task, and an emoji.</li>
        <li>Click the <b>🗑️</b> icon to delete a schedule item.</li>
        <li>Use the <b>👁️</b> icon to show or hide the controls.</li>
      </ul>
    </div>
  </div>
  <script src="classroomScheduleWidget.js" defer></script>
</body>
</html>

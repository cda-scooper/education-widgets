<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Pet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="class-pet-container">
        <div class="pet">
            <div class="pet-body"></div>
        </div>
        <div class="treats-container"></div>
        <div class="controls">
            <div class="speed-controls">
                <button class="speed-button" data-speed="slow">🐢 Slow</button>
                <button class="speed-button" data-speed="medium">🐰 Medium</button>
                <button class="speed-button" data-speed="fast">⚡ Fast</button>
            </div>
            <button class="treat-button">🍪 Drop Treat</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

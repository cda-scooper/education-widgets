<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Calendar Widget</title>
  <link rel="stylesheet" href="style.css">
  <script src="classroomCalendarWidget.js" defer></script>
</head>
<body>
  <div style="margin-bottom: 10px;">
    <button id="view-7">7-Day View</button>
    <button id="view-30">30-Day View</button>
  </div>
  <div id="calendar-grid"></div>
  <button id="add-event-btn">➕ Add Event</button>
  <div id="event-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Add New Event</h2>
      <input type="date" id="event-date" placeholder="Date">
      <input type="text" id="event-description" placeholder="Description">
      <input type="text" id="event-emoji" placeholder="Emoji">
      <button id="save-event-btn">Save Event</button>
    </div>
  </div>
</body>
</html>
